[server]
address = "127.0.0.1:8080"
metrics_address = "127.0.0.1:9090"
worker_threads = 0

[cache]
memory_max_size = "512m"
disk_path = "/tmp/cdn_cache.db"
disk_max_size = "1g"
default_ttl = 3600

[origin]
timeout = 10
max_retries = 3
shield_nodes = ["http://httpbin.org"]
pool_size = 100

[tls]
cert_path = "config/cert.pem"
key_path = "config/key.pem"
acme_enabled = false

[control_plane]
api_endpoint = "http://localhost:9091/heartbeat"
heartbeat_interval = 30
location = "edge-local-1"

[security]
rate_limit_requests = 1000
rate_limit_window = 60
ddos_detection_enabled = true

[logging]
level = "info"
