# CDN Edge Server - Test Configuration

[server]
address = "0.0.0.0:4433"
metrics_address = "0.0.0.0:9090"
worker_threads = 0  # 0 = auto

[cache]
memory_max_size = "512Mi"
disk_path = "/tmp/cdn-cache"
disk_max_size = "5Gi"
default_ttl = 3600  # 1 hour in seconds

[origin]
timeout = 30  # seconds
max_retries = 3
shield_nodes = []
pool_size = 100

[tls]
[control_plane]
api_endpoint = "http://localhost:8080"
heartbeat_interval = 30  # seconds
location = "test-edge-1"

[security]
rate_limit_requests = 10000
rate_limit_window = 60  # seconds
ddos_detection_enabled = false

[logging]
level = "debug"
